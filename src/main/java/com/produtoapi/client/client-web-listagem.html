<!DOCTYPE html>
<html lang ="pt-BR"> <!-- Define o tipo de documento como HTML5 e a linguagem -->
	<head>
		<meta charset="UTF-8"> <!-- Conjunto de caracteres da página -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Lista de Produtos</title>
	</head>
	<body>
		<h2>Lista de Produtos - HTML/JavaScript</h2>
		<!-- Tabele que exibirá a lista de produtos -->
		<table id="produtosTable" border="1">
			<thead>
				<tr>
					<th>ID</th> <!-- Cabeçalho da coluna -->
					<th>Nome</th>
					<th>Preço</th>
				</tr>
			</thead>
			<tbody>
				<!-- Linhas da tabela serão inseridas aqui - será feita uma consulta no Spring
				 e então no Banco de Dados para preencher -->
			</tbody>
		</table>
		
		<!-- Mensagem de Erro -->
		<div id="erroMensagem" style="color: red; display: none;">
			Erro ao buscar produtos. Por favor, tente mais tarde.
		</div>
		
		<!-- Total de Produtos -->
		<div id="totalProdutos">
			Total de Produtos: 0
		</div>
	</body>
</html>
