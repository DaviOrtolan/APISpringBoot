<!DOCTYPE html>
<html lang ="pt-BR"> <!-- Define o tipo de documento como HTML5 e a linguagem -->
	<head>
		<meta charset="UTF-8"> <!-- Conjunto de caracteres da página -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Lista de Produtos</title>
	</head>
	<body>
		<h2>Lista de Produtos - HTML/JavaScript</h2>
		<!-- Tabele que exibirá a lista de produtos -->
		<table id="produtosTable" border="1">
			<thead>
				<tr>
					<th>ID</th> <!-- Cabeçalho da coluna -->
					<th>Nome</th>
					<th>Preço</th>
				</tr>
			</thead>
			<tbody>
				<!-- Linhas da tabela serão inseridas aqui - será feita uma consulta no Spring
				 e então no Banco de Dados para preencher -->
			</tbody>
		</table>
		
		<!-- Mensagem de Erro -->
		<div id="erroMensagem" style="color: red; display: none;">
			Erro ao buscar produtos. Por favor, tente mais tarde.
		</div>
		
		<!-- Total de Produtos -->
		<div id="totalProdutos">
			Total de Produtos: 0
		</div>
		
		<!-- Função JavaScript -->
		<script>
			// Função para listar os produtos
			function listarProdutos() {
				// faz uma requisição GET 
				fetch('http://localhost:8080/produtos')
				.then(response => {
					if(!response.ok) {
						// Lança um erro se a resposta não for OK
						throw new Error('Erro na rede: ' + response.status);
					}
					// Converte a resposta para JSON
					return response.json();
				})
				.then(data => {
					// Obter o corpo da tabela 
					const tableBody = document.getElementsById('produtosTable').getElementsByTagName('tbody')[0];
					let totalProdutos = 0; // Inicializa um contador de produtos
					// Iterar sobre os dados recebidos e criar as linhas da tabela
					data.forEach(produto => {
						const row = tableBody.insertRow();
						const cellId = row.insertCell(0);
						const cellName = row.insertRow(1);
						const cellPreco = row.insertCell(2);
						// Insere os dados nas células
						cellId.textContent = produto.id; // insere o ID do produto na célula
						cellName.textContent = produto.nome;
						cellPreco.textContent = produto.preco;
						totalProdutos++; // incrementa o contador de produtos
					});
					// Exibe o total de produtos
					document.getElementById('totalProdutos').textContent = 'Total de Produtos: ' + totalProdutos;
				})
			}
		</script>
	</body>
</html>
